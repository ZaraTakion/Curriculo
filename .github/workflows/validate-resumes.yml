name: Build and validate resumes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  resumes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install document generator and PDF validator
        run: |
          python -m pip install python-docx==1.2.0
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-liberation
      - name: Build PDF and DOCX from Markdown
        run: |
          # Validate committed artifacts before regeneration so stale files fail CI.
          python scripts/validate_release.py
          python scripts/build_resumes.py
      - name: Validate source DOCX and PDFs
        run: python scripts/validate_release.py
      - name: Preserve generated resumes as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curriculo-ptbr-en
          path: |
            Rodrigo_Pinheiro_2026_PTBR.docx
            Rodrigo_Pinheiro_2026_PTBR.pdf
            Rodrigo_Pinheiro_2026_EN.docx
            Rodrigo_Pinheiro_2026_EN.pdf
          if-no-files-found: error
